[project]
name = "storylens"
version = "1.0.0"
description = "StoryLens: upload a photo, add a few details, and get a short personal story written by a vision model. Nothing is stored."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "flask>=3.1",
    "openai>=1.50",
    "gunicorn>=23",
    "python-dotenv>=1.0",  # `flask run` reads a local .env with it
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storylens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=storylens --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
